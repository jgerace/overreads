<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goodreads × Libby</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #333;
      background: #fff;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #e0e0e0;
      background: #f7f7f7;
    }

    .header-logo { font-size: 18px; }

    .header-title {
      font-weight: 700;
      font-size: 14px;
    }

    .body { padding: 14px; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #555;
    }

    .hint {
      font-size: 11px;
      color: #888;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .hint a {
      color: #00635d;
      text-decoration: none;
    }

    .hint a:hover { text-decoration: underline; }

    .input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    input[type="text"] {
      flex: 1;
      padding: 7px 10px;
      border: 1px solid #d0d0d0;
      border-radius: 5px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus {
      border-color: #00635d;
    }

    button {
      padding: 7px 12px;
      background: #00635d;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    button:hover { opacity: 0.85; }

    .status {
      margin-top: 10px;
      font-size: 12px;
      min-height: 16px;
      color: #1a7f37;
      font-weight: 500;
    }

    .status.error { color: #c0392b; }

    .preview {
      margin-top: 10px;
      padding: 8px 10px;
      background: #f0faf8;
      border: 1px solid #b2dbd6;
      border-radius: 5px;
      font-size: 11px;
      color: #00635d;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-logo">📚</span>
    <span class="header-title">Goodreads × Libby</span>
  </div>

  <div class="body">
    <label for="slug-input">Your library's OverDrive slug</label>
    <p class="hint">
      Find it in your Libby/OverDrive URL, e.g.<br>
      <strong>freelibrary</strong>.overdrive.com →
      slug is <strong>freelibrary</strong>
    </p>

    <div class="input-row">
      <input type="text" id="slug-input" placeholder="e.g. freelibrary" spellcheck="false" />
      <button id="save-btn">Save</button>
    </div>

    <div class="status" id="status"></div>
    <div class="preview" id="preview"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
