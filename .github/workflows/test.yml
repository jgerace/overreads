name: Tests

on:
  # Every merge (or direct push) to main: this run sets the README badge.
  push:
    branches: [main]
  # Pull requests, so problems show up before merging.
  pull_request:
  # Allow a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (ESLint + Mozilla's extension linter)
        run: npm run lint

      - name: Test
        run: npm test
